name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
        with:
          # Need full history + tags so the release-notes step can diff
          # against the previous tag.
          fetch-depth: 0

      - name: Show Xcode version
        run: xcodebuild -version

      # Import the stable self-signed code-signing certificate so every release
      # is signed with the SAME identity. macOS keys the Accessibility (TCC)
      # grant on the bundle's code-signing designated requirement; a stable
      # identity keeps that requirement constant across updates, so users keep
      # their Accessibility permission instead of being re-prompted ("wants to
      # control your computer using accessibility") after each update. The
      # secrets are produced by scripts/generate-signing-cert.sh.
      - name: Import signing certificate
        env:
          SIGNING_CERT_P12_BASE64: ${{ secrets.SIGNING_CERT_P12_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          if [ -z "$SIGNING_CERT_P12_BASE64" ] || [ -z "$SIGNING_CERT_PASSWORD" ]; then
            echo "::error::SIGNING_CERT_P12_BASE64 / SIGNING_CERT_PASSWORD secrets are not set."
            echo "::error::Run scripts/generate-signing-cert.sh and add the two secrets."
            exit 1
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/cliptrace-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          echo "$SIGNING_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"
          # Throwaway keychain for this build only; add it to the search list so
          # codesign can find the identity, and disable the auto-lock timeout.
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$SIGNING_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | sed 's/"//g')
          rm -f "$CERT_PATH"
          echo "Available signing identities:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Build (Release)
        run: |
          # The project sets GENERATE_INFOPLIST_FILE=YES, so Xcode synthesises
          # CFBundleShortVersionString from MARKETING_VERSION and CFBundleVersion
          # from CURRENT_PROJECT_VERSION at build time — overwriting anything
          # poked into Info.plist directly. Drive both from the tag here.
          # CFBundleVersion must track the release too: otherwise Sparkle sees
          # the running app as version "1" (> every 0.9.x) and never updates.
          VERSION="${GITHUB_REF_NAME#v}"
          xcodebuild \
            -project ClipTrace.xcodeproj \
            -scheme ClipTrace \
            -configuration Release \
            -derivedDataPath build \
            -skipMacroValidation \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="ClipTrace Self-Signed" \
            DEVELOPMENT_TEAM="" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$VERSION" \
            build
          APP="build/Build/Products/Release/ClipTrace.app"
          # Fail the release if the version didn't actually bake in — otherwise
          # we ship a bundle that shows the wrong version and breaks auto-update.
          BUILT_SHORT=$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")
          BUILT_BUILD=$(plutil -extract CFBundleVersion raw -o - "$APP/Contents/Info.plist")
          echo "Baked version: short=$BUILT_SHORT build=$BUILT_BUILD (tag=$VERSION)"
          if [ "$BUILT_SHORT" != "$VERSION" ] || [ "$BUILT_BUILD" != "$VERSION" ]; then
            echo "::error::Bundle version ($BUILT_SHORT / $BUILT_BUILD) does not match tag ($VERSION)."
            exit 1
          fi
          # Guard against silently shipping an ad-hoc build (which would
          # reintroduce the repeated-permission bug): verify the signature and
          # print the designated requirement that the grant is keyed on.
          codesign --verify --deep --strict --verbose=2 "$APP"
          if codesign -dvv "$APP" 2>&1 | grep -q "Signature=adhoc"; then
            echo "::error::Release app is ad-hoc signed — the signing identity was not used."
            exit 1
          fi
          echo "Designated requirement (grant is keyed on this):"
          codesign -d -r- "$APP"

      - name: Package .app into dmg
        id: package
        run: |
          APP_PATH="build/Build/Products/Release/ClipTrace.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "App not found at $APP_PATH"
            find build -name "*.app" -type d
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          DMG_NAME="ClipTrace-${VERSION}.dmg"
          STAGING=$(mktemp -d)
          cp -R "$APP_PATH" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname "ClipTrace" \
            -srcfolder "$STAGING" \
            -ov -format UDZO \
            "$DMG_NAME"
          echo "dmg=$DMG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Sparkle ships precompiled `sign_update` in its release tarball. We
      # grab just that tool rather than the whole framework so the step stays
      # fast and reproducible — the binary is a hermetic command-line app and
      # doesn't need Xcode or anything else.
      - name: Fetch Sparkle sign_update tool
        run: |
          SPARKLE_VERSION="2.9.2"
          mkdir -p /tmp/sparkle
          gh release download "$SPARKLE_VERSION" \
            --repo sparkle-project/Sparkle \
            --pattern "Sparkle-${SPARKLE_VERSION}.tar.xz" \
            --dir /tmp/sparkle
          tar -xf "/tmp/sparkle/Sparkle-${SPARKLE_VERSION}.tar.xz" -C /tmp/sparkle
          ls /tmp/sparkle/bin/
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Sign DMG with EdDSA key
        id: sign
        env:
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_EDDSA_PRIVATE_KEY" ]; then
            echo "::error::SPARKLE_EDDSA_PRIVATE_KEY secret is not set. Add the base64 private key from generate_keys."
            exit 1
          fi
          # `sign_update -f -` reads the private key from stdin (one base64 line)
          # and prints `sparkle:edSignature="..." length="..."` on success.
          SIG_LINE=$(printf "%s" "$SPARKLE_EDDSA_PRIVATE_KEY" | /tmp/sparkle/bin/sign_update -f - "${{ steps.package.outputs.dmg }}")
          echo "Signature line: $SIG_LINE"
          ED_SIG=$(printf "%s" "$SIG_LINE" | sed -nE 's/.*sparkle:edSignature="([^"]+)".*/\1/p')
          LENGTH=$(printf "%s" "$SIG_LINE" | sed -nE 's/.*length="([^"]+)".*/\1/p')
          if [ -z "$ED_SIG" ] || [ -z "$LENGTH" ]; then
            echo "::error::Failed to parse sign_update output"
            exit 1
          fi
          echo "ed_signature=$ED_SIG" >> "$GITHUB_OUTPUT"
          echo "length=$LENGTH" >> "$GITHUB_OUTPUT"

      # Build the appcast item for this release. We try to fetch the previous
      # appcast.xml (served by GitHub as `releases/latest/download/appcast.xml`,
      # which always resolves to the latest published release's asset). If it
      # exists we keep its <item> entries and prepend the new one so users see
      # full version history; otherwise we start fresh (bootstrap case for the
      # first Sparkle release).
      - name: Generate appcast.xml
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.package.outputs.version }}"
          TAG="${GITHUB_REF_NAME}"
          DMG="${{ steps.package.outputs.dmg }}"
          ED_SIG="${{ steps.sign.outputs.ed_signature }}"
          LENGTH="${{ steps.sign.outputs.length }}"
          DMG_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${DMG}"
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG}"
          PUBDATE=$(date -u +"%a, %d %b %Y %H:%M:%S +0000")

          PREV_ITEMS_FILE=$(mktemp)
          PREV_TAG=$(git tag --sort=-v:refname --merged "${TAG}^" 2>/dev/null | head -n 1 || true)
          if [ -n "$PREV_TAG" ] && gh release download "$PREV_TAG" \
              --repo "${{ github.repository }}" \
              --pattern "appcast.xml" \
              --output /tmp/prev-appcast.xml; then
            echo "Existing appcast from $PREV_TAG found — preserving history."
            # Keep history but drop any item for the version currently being
            # rebuilt, otherwise rerunning the same tag duplicates appcast items.
            python3 - /tmp/prev-appcast.xml "$PREV_ITEMS_FILE" "$VERSION" <<'PY'
          import re
          import sys
          
          src, dst, version = sys.argv[1:4]
          xml = open(src).read()
          items = re.findall(r"<item>.*?</item>", xml, flags=re.S)
          seen = {version}
          with open(dst, "w") as out:
              for item in items:
                  m = re.search(r"<sparkle:version>(.*?)</sparkle:version>", item)
                  item_version = m.group(1).strip() if m else ""
                  if item_version in seen:
                      continue
                  if item_version:
                      seen.add(item_version)
                  out.write(item.rstrip() + "\n")
          PY
          else
            echo "No prior appcast — starting fresh."
            : > "$PREV_ITEMS_FILE"
          fi

          {
            echo '<?xml version="1.0" standalone="yes"?>'
            echo '<rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" xmlns:dc="http://purl.org/dc/elements/1.1/">'
            echo '    <channel>'
            echo '        <title>ClipTrace</title>'
            echo "        <link>https://github.com/${{ github.repository }}</link>"
            echo '        <description>ClipTrace release feed</description>'
            echo '        <language>en</language>'
            echo '        <item>'
            echo "            <title>Version ${VERSION}</title>"
            echo "            <link>${RELEASE_URL}</link>"
            echo "            <sparkle:version>${VERSION}</sparkle:version>"
            echo "            <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>"
            echo '            <sparkle:minimumSystemVersion>14.0</sparkle:minimumSystemVersion>'
            echo "            <description><![CDATA[See <a href=\"${RELEASE_URL}\">${TAG}</a> for release notes.]]></description>"
            echo "            <pubDate>${PUBDATE}</pubDate>"
            echo "            <enclosure url=\"${DMG_URL}\" sparkle:edSignature=\"${ED_SIG}\" length=\"${LENGTH}\" type=\"application/octet-stream\" />"
            echo '        </item>'
            sed 's/^/        /' "$PREV_ITEMS_FILE"
            echo '    </channel>'
            echo '</rss>'
          } > appcast.xml

          echo "--- Generated appcast.xml ---"
          cat appcast.xml

      # `--generate-notes` only surfaces PRs, and this repo merges feature
      # branches directly to main — which leaves the release body empty save
      # for a Full Changelog link. Build concise categorized notes from
      # conventional commit subjects between the previous tag and this one.
      - name: Generate release notes
        id: notes
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          PREV_TAG=$(git tag --sort=-v:refname --merged "${TAG}^" 2>/dev/null | head -n 1 || true)
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"

          python3 - "$TAG" "${PREV_TAG:-}" "${{ github.repository }}" "$NOTES_FILE" <<'PY'
          import re
          import subprocess
          import sys

          tag, prev_tag, repo, out_path = sys.argv[1:5]
          repo_url = f"https://github.com/{repo}"

          if prev_tag:
              rng = f"{prev_tag}..{tag}"
              compare_url = f"{repo_url}/compare/{prev_tag}...{tag}"
          else:
              rng = tag
              compare_url = f"{repo_url}/commits/{tag}"

          raw = subprocess.check_output(
              ["git", "log", rng, "--no-merges",
               "--pretty=format:%H%x1f%s%x1f%b%x1e"],
              text=True,
          )

          categories = [
              ("Features", r"feat"),
              ("Bug Fixes", r"fix"),
              ("Performance", r"perf"),
              ("Refactoring", r"refactor"),
              ("Documentation", r"docs"),
              ("Build & CI", r"(build|ci)"),
              ("Chores", r"chore"),
          ]
          prefix_re = re.compile(r"^[a-zA-Z]+(\([^)]*\))?!?:\s*")
          bump_re = re.compile(r"^chore.*bump version", re.I)

          grouped = {title: [] for title, _ in categories}
          other = []

          for record in raw.split("\x1e"):
              # Do not use strip() here: Python treats ASCII unit separator
              # (\x1f) as whitespace, so commits with an empty body would lose
              # the trailing field separator and fail to unpack.
              record = record.strip("\r\n")
              if not record:
                  continue
              parts = record.split("\x1f", 2)
              if len(parts) < 2:
                  continue
              sha, subject = parts[:2]
              body = parts[2] if len(parts) > 2 else ""
              if bump_re.match(subject):
                  continue

              clean_subject = prefix_re.sub("", subject).strip()
              short = sha[:7]
              # Keep each changelog entry to a single line. Detailed commit
              # bodies/trailers are intentionally omitted from release notes.
              entry = f"- {clean_subject} ([`{short}`]({repo_url}/commit/{sha}))"

              matched = None
              for title, pat in categories:
                  if re.match(rf"^{pat}(\([^)]*\))?!?:", subject, re.I):
                      matched = title
                      break
              (grouped[matched] if matched else other).append(entry)

          with open(out_path, "w") as f:
              for title, _ in categories:
                  if grouped[title]:
                      f.write(f"### {title}\n\n")
                      f.write("\n\n".join(grouped[title]) + "\n\n")
              if other:
                  f.write("### Other Changes\n\n")
                  f.write("\n\n".join(other) + "\n\n")
              f.write(f"\n**Full Changelog**: {compare_url}\n")
          PY

          echo "--- Generated release notes ---"
          cat "$NOTES_FILE"
          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "${{ steps.package.outputs.dmg }}" \
              "appcast.xml" \
              --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file "${{ steps.notes.outputs.notes_file }}" \
              --latest
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file "${{ steps.notes.outputs.notes_file }}" \
              --latest \
              "${{ steps.package.outputs.dmg }}" \
              "appcast.xml"
          fi
