name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
        with:
          # Need full history + tags so the release-notes step can diff
          # against the previous tag.
          fetch-depth: 0

      # The macos-14 image still defaults to Xcode 15.4, whose stricter Swift
      # concurrency checking rejects code this project compiles cleanly under
      # Xcode 16 (the declared toolchain — see AGENT.md). Select the newest
      # installed Xcode 16 so the release matches local builds.
      - name: Select Xcode 16
        run: |
          XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n1)
          if [ -z "$XCODE" ]; then
            XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n1)
          fi
          echo "Selecting $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"

      - name: Show Xcode version
        run: xcodebuild -version

      # Import the stable self-signed code-signing certificate so every release
      # is signed with the SAME identity. macOS keys the Accessibility (TCC)
      # grant on the bundle's code-signing designated requirement; a stable
      # identity keeps that requirement constant across updates, so users keep
      # their Accessibility permission instead of being re-prompted ("wants to
      # control your computer using accessibility") after each update. The
      # secrets are produced by scripts/generate-signing-cert.sh.
      - name: Import signing certificate
        env:
          SIGNING_CERT_P12_BASE64: ${{ secrets.SIGNING_CERT_P12_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          if [ -z "$SIGNING_CERT_P12_BASE64" ] || [ -z "$SIGNING_CERT_PASSWORD" ]; then
            echo "::error::SIGNING_CERT_P12_BASE64 / SIGNING_CERT_PASSWORD secrets are not set."
            echo "::error::Run scripts/generate-signing-cert.sh and add the two secrets."
            exit 1
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/cliptrace-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          echo "$SIGNING_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"
          # Throwaway keychain for this build only; add it to the search list so
          # codesign can find the identity, and disable the auto-lock timeout.
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$SIGNING_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | sed 's/"//g')
          rm -f "$CERT_PATH"
          echo "Available signing identities:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Build (Release)
        run: |
          # The project sets GENERATE_INFOPLIST_FILE=YES, so Xcode synthesises
          # CFBundleShortVersionString from MARKETING_VERSION and CFBundleVersion
          # from CURRENT_PROJECT_VERSION at build time — overwriting anything
          # poked into Info.plist directly. Drive both from the tag here.
          # CFBundleVersion must track the release too: otherwise Sparkle sees
          # the running app as version "1" (> every 0.9.x) and never updates.
          VERSION="${GITHUB_REF_NAME#v}"
          xcodebuild \
            -project ClipTrace.xcodeproj \
            -scheme ClipTrace \
            -configuration Release \
            -derivedDataPath build \
            -skipMacroValidation \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="ClipTrace Self-Signed" \
            DEVELOPMENT_TEAM="" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$VERSION" \
            build
          APP="build/Build/Products/Release/ClipTrace.app"
          # Fail the release if the version didn't actually bake in — otherwise
          # we ship a bundle that shows the wrong version and breaks auto-update.
          BUILT_SHORT=$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")
          BUILT_BUILD=$(plutil -extract CFBundleVersion raw -o - "$APP/Contents/Info.plist")
          echo "Baked version: short=$BUILT_SHORT build=$BUILT_BUILD (tag=$VERSION)"
          if [ "$BUILT_SHORT" != "$VERSION" ] || [ "$BUILT_BUILD" != "$VERSION" ]; then
            echo "::error::Bundle version ($BUILT_SHORT / $BUILT_BUILD) does not match tag ($VERSION)."
            exit 1
          fi
          # Guard against silently shipping an ad-hoc build (which would
          # reintroduce the repeated-permission bug): verify the signature and
          # print the designated requirement that the grant is keyed on.
          codesign --verify --deep --strict --verbose=2 "$APP"
          if codesign -dvv "$APP" 2>&1 | grep -q "Signature=adhoc"; then
            echo "::error::Release app is ad-hoc signed — the signing identity was not used."
            exit 1
          fi
          echo "Designated requirement (grant is keyed on this):"
          codesign -d -r- "$APP"

      - name: Package .app into dmg
        id: package
        run: |
          APP_PATH="build/Build/Products/Release/ClipTrace.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "App not found at $APP_PATH"
            find build -name "*.app" -type d
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          DMG_NAME="ClipTrace-${VERSION}.dmg"
          STAGING=$(mktemp -d)
          cp -R "$APP_PATH" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname "ClipTrace" \
            -srcfolder "$STAGING" \
            -ov -format UDZO \
            "$DMG_NAME"
          echo "dmg=$DMG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Sparkle ships precompiled `sign_update` in its release tarball. We
      # grab just that tool rather than the whole framework so the step stays
      # fast and reproducible — the binary is a hermetic command-line app and
      # doesn't need Xcode or anything else.
      - name: Fetch Sparkle sign_update tool
        run: |
          SPARKLE_VERSION="2.9.2"
          mkdir -p /tmp/sparkle
          gh release download "$SPARKLE_VERSION" \
            --repo sparkle-project/Sparkle \
            --pattern "Sparkle-${SPARKLE_VERSION}.tar.xz" \
            --dir /tmp/sparkle
          tar -xf "/tmp/sparkle/Sparkle-${SPARKLE_VERSION}.tar.xz" -C /tmp/sparkle
          ls /tmp/sparkle/bin/
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Sign DMG with EdDSA key
        id: sign
        env:
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_EDDSA_PRIVATE_KEY" ]; then
            echo "::error::SPARKLE_EDDSA_PRIVATE_KEY secret is not set. Add the base64 private key from generate_keys."
            exit 1
          fi
          # `sign_update -f -` reads the private key from stdin (one base64 line)
          # and prints `sparkle:edSignature="..." length="..."` on success.
          SIG_LINE=$(printf "%s" "$SPARKLE_EDDSA_PRIVATE_KEY" | /tmp/sparkle/bin/sign_update -f - "${{ steps.package.outputs.dmg }}")
          echo "Signature line: $SIG_LINE"
          ED_SIG=$(printf "%s" "$SIG_LINE" | sed -nE 's/.*sparkle:edSignature="([^"]+)".*/\1/p')
          LENGTH=$(printf "%s" "$SIG_LINE" | sed -nE 's/.*length="([^"]+)".*/\1/p')
          if [ -z "$ED_SIG" ] || [ -z "$LENGTH" ]; then
            echo "::error::Failed to parse sign_update output"
            exit 1
          fi
          echo "ed_signature=$ED_SIG" >> "$GITHUB_OUTPUT"
          echo "length=$LENGTH" >> "$GITHUB_OUTPUT"

      # Build the Sparkle appcast and the GitHub Release body in one shot via
      # scripts/build_release_notes.py. The script embeds the *full* changelog
      # into the appcast <description> (so the updater dialog shows real notes
      # instead of a bare link) and, when docs/release-notes/<version>.md
      # provides `## en` / `## zh` sections, emits one <description xml:lang="…">
      # per language — Sparkle then shows the one matching the user's system
      # language. With no notes file it falls back to an auto-generated English
      # changelog from conventional-commit subjects. We fetch the previous
      # release's appcast.xml (best effort) so prior <item> history is kept.
      - name: Generate appcast & release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.package.outputs.version }}"
          TAG="${GITHUB_REF_NAME}"
          DMG="${{ steps.package.outputs.dmg }}"
          PREV_TAG=$(git tag --sort=-v:refname --merged "${TAG}^" 2>/dev/null | head -n 1 || true)
          PREV_APPCAST=""
          if [ -n "$PREV_TAG" ] && gh release download "$PREV_TAG" \
              --repo "${{ github.repository }}" \
              --pattern "appcast.xml" \
              --output /tmp/prev-appcast.xml; then
            echo "Existing appcast from $PREV_TAG found — preserving history."
            PREV_APPCAST="/tmp/prev-appcast.xml"
          else
            echo "No prior appcast — starting fresh."
          fi

          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          VERSION="$VERSION" \
          TAG="$TAG" \
          REPO="${{ github.repository }}" \
          DMG_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${DMG}" \
          ED_SIG="${{ steps.sign.outputs.ed_signature }}" \
          LENGTH="${{ steps.sign.outputs.length }}" \
          PREV_TAG="$PREV_TAG" \
          PREV_APPCAST="$PREV_APPCAST" \
          NOTES_DIR="docs/release-notes" \
          OUT_APPCAST="appcast.xml" \
          OUT_BODY="$NOTES_FILE" \
          PUBDATE="$(date -u +"%a, %d %b %Y %H:%M:%S +0000")" \
          python3 scripts/build_release_notes.py

          echo "--- Generated appcast.xml ---"
          cat appcast.xml
          echo "--- Generated release notes ---"
          cat "$NOTES_FILE"
          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "${{ steps.package.outputs.dmg }}" \
              "appcast.xml" \
              --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file "${{ steps.notes.outputs.notes_file }}" \
              --latest
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file "${{ steps.notes.outputs.notes_file }}" \
              --latest \
              "${{ steps.package.outputs.dmg }}" \
              "appcast.xml"
          fi
