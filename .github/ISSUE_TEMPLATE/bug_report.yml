name: Bug report
description: Report a reproducible problem in Clipth.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not include private clipboard contents, tokens, passwords, or personal data.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Clipboard capture
        - Search
        - MCP
        - Quick Paste
        - Snippets
        - Export
        - Settings
        - Release / installation
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Clipth version
      placeholder: "0.9.7, main@abcdef, etc."
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "14.6, 15.5, 26.0 beta, etc."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Copy...
        3. Search...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Redact private clipboard data before uploading.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed secrets, tokens, passwords, and personal clipboard contents from this issue.
          required: true
